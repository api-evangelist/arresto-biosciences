name: Arresto Biosciences
description: 'Arresto Biosciences, Inc. was a privately-held, development-stage biotechnology company
  headquartered in Palo Alto, California, focused on medicines to treat fibrotic diseases and cancer by
  targeting enzymes involved in the synthesis of the extracellular matrix. Its lead product was AB0024,
  a humanized monoclonal antibody targeting the human lysyl oxidase-like-2 (LOXL2) protein, then in
  Phase I studies for idiopathic pulmonary fibrosis and advanced solid tumors. Founded circa 2007 and
  backed by Kleiner Perkins Caufield & Byers, HealthCare Ventures, Northgate Capital, DAG Ventures and
  Abbott Biotech Ventures, Arresto was acquired by Gilead Sciences for $225 million; the deal was
  announced December 20, 2010 and had closed by February 2011. The company no longer operates as an
  independent entity, publishes no developer or API surface, and its former domain (arrestobio.com) no
  longer resolves.'
